# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# mouse
set -g mouse on

# smoother wheel: scroll 2 lines per tick in copy-mode instead of the default ~5
bind -T copy-mode    WheelUpPane   send-keys -X -N 2 scroll-up
bind -T copy-mode    WheelDownPane send-keys -X -N 2 scroll-down
bind -T copy-mode-vi WheelUpPane   send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 2 scroll-down

# status bar
set -g status-left-length 40
set -g status-left "[#S] "
set -g status-justify centre
set -g status-right "%I:%M%p %d-%b-%y"

# pane labels
set -g pane-border-status top
set -g pane-border-format " #P:#T "

# prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# window nubering
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# window/pane cwd
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"

# mnemonic splits: the key looks like the divider it creates
bind '|' split-window -h -c "#{pane_current_path}"
bind '_' split-window -v -c "#{pane_current_path}"

# repeatable pane resize (prefix then H/J/K/L, hold to repeat)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Ctrl+Tab / Ctrl+Shift+Tab -> switch tmux windows
# extended-keys decodes these into real keys; Shift+Tab folds into BTab,
# so Ctrl+Shift+Tab arrives as C-BTab (not C-S-Tab).
# WezTerm's config passes both through with SendKey, preserving the extended-key
# encoding negotiated with tmux rather than hard-coding terminal escape strings.
set -s extended-keys on
bind -n C-Tab next-window
bind -n C-BTab previous-window

# Ctrl+` / Ctrl+Shift+` -> switch tmux sessions
# WezTerm does not reserve these, so they use the same negotiated encoding.
bind -n 'C-`' switch-client -n
bind -n 'C-S-`' switch-client -p

# Ctrl+arrows -> directional pane focus.
# On macOS free Ctrl+arrows from Mission Control first; on GNOME/KDE unbind the
# workspace-switching shortcuts.
bind -n C-Left  select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up    select-pane -U
bind -n C-Down  select-pane -D

# unified display-menu experience across session / window / pane.
# first keystroke picks the scope (S / W / P), second keystroke picks the action.
# shared action vocabulary where it makes sense: N = new, R = rename, X = kill,
# C = choose/tree, D = detach, Z = zoom.

# session menu
bind-key s choose-tree -Zs -O name
bind-key S display-menu -T "#[align=centre]Session: #S" \
    "New"        N 'command-prompt -p "New session name:" { new-session -s "%%" }' \
    "Rename"     R 'command-prompt -I "#S" { rename-session -- "%%" }' \
    "Choose"     C 'choose-tree -Zs -O name' \
    "Last"       L 'switch-client -l' \
    "Previous"   p 'switch-client -p' \
    "Next"       n 'switch-client -n' \
    "Detach"     D 'detach-client' \
    "" \
    "Kill"       X 'confirm-before -p "Kill session #S? (y/n)" kill-session'

# window menu
bind-key W display-menu -T "#[align=centre]Window: #I:#W" \
    "New"        N 'new-window -c "#{pane_current_path}"' \
    "Rename"     R 'command-prompt -I "#W" { rename-window -- "%%" }' \
    "Choose"     C 'choose-tree -Zw' \
    "Previous"   p 'previous-window' \
    "Next"       n 'next-window' \
    "Move"       M 'command-prompt -p "Move window to:" { move-window -t "%%" }' \
    "Renumber"   O 'move-window -r' \
    "" \
    "Kill"       X 'confirm-before -p "Kill window #W? (y/n)" kill-window'

# pane menu
bind-key P display-menu -T "#[align=centre]Pane: #P" \
    "New (split down)"  N 'split-window -v -c "#{pane_current_path}"' \
    "Split right"       V 'split-window -h -c "#{pane_current_path}"' \
    "Rename (title)"    R 'command-prompt -I "#T" { select-pane -T "%%" }' \
    "Zoom toggle"       Z 'resize-pane -Z' \
    "Break to window"   B 'break-pane' \
    "Swap previous"     p 'swap-pane -U' \
    "Swap next"         n 'swap-pane -D' \
    "" \
    "Kill"              X 'confirm-before -p "Kill pane #P? (y/n)" kill-pane'

# package manager
run '~/.tmux/plugins/tpm/tpm'
